name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icon and splash
        run: >
          npx --yes @capacitor/assets generate --android
          --iconBackgroundColor '#18233a' --iconBackgroundColorDark '#18233a'
          --splashBackgroundColor '#18233a' --splashBackgroundColorDark '#18233a'

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Al-Quran-30-Juz.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Al-Quran-30-Juz-apk
          path: Al-Quran-30-Juz.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Al-Quran 30 Juz v1.0.${{ github.run_number }}
          files: Al-Quran-30-Juz.apk
