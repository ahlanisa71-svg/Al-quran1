<style>
:root{--fam:'Amiri Quran','Noto Naskh Arabic',serif;--szA:32px;--szT:15px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--txt);background:var(--bgc)}
body{--txt:#fff;--sub:rgba(255,255,255,.74);--glass:rgba(18,28,48,.40);--glass2:rgba(255,255,255,.14);--bd:rgba(255,255,255,.26);--acc:#4ade80;--bgc:#18233a;
 --bgi:radial-gradient(circle at 12% 8%,rgba(255,255,255,.38),transparent 42%),radial-gradient(circle at 92% 88%,rgba(74,222,128,.22),transparent 46%),linear-gradient(180deg,#b6bac5 0%,#8a93a3 26%,#5e6b80 52%,#2f3e55 78%,#172236 100%)}
body[data-theme=terang]{--txt:#1b2430;--sub:#5d6877;--glass:rgba(255,255,255,.88);--glass2:rgba(0,0,0,.05);--bd:rgba(0,0,0,.08);--bgc:#f1f3f6;--bgi:linear-gradient(#f1f3f6,#f1f3f6);--acc:#16a34a}
body[data-theme=gelap]{--txt:#eef1f6;--sub:#a3acba;--glass:rgba(52,58,76,.92);--glass2:rgba(255,255,255,.07);--bd:rgba(255,255,255,.08);--bgc:#232837;--bgi:linear-gradient(#232837,#232837)}
body[data-theme=cokelat]{--txt:#f6ece4;--sub:#c9b3a3;--glass:rgba(98,68,53,.92);--glass2:rgba(255,255,255,.08);--bd:rgba(255,255,255,.1);--bgc:#3b2a22;--bgi:linear-gradient(#3b2a22,#3b2a22)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ar{font-family:var(--fam);direction:rtl}
.hidden{display:none!important}
#app{position:fixed;inset:0;background:var(--bgi),var(--bgc);background-attachment:fixed}
.glass{background:var(--glass);backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);border:1px solid var(--bd);box-shadow:0 8px 32px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.22);border-radius:22px}
#main{position:absolute;inset:0;left:0;right:0;margin:0 auto;max-width:560px;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 128px}
.ttl{margin:6px 4px 10px;font-size:26px;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.sub{margin:0 6px 14px;color:var(--sub);font-size:14px}
.tabs{display:flex;padding:4px;margin-bottom:12px}
.tabs button{flex:1;padding:13px 0;letter-spacing:.14em;font-size:12px;font-weight:600;color:var(--sub);border-radius:18px;position:relative}
.tabs button.on{color:var(--acc);background:var(--glass2)}
.tabs button.on::after{content:'';position:absolute;left:24%;right:24%;bottom:4px;height:2px;border-radius:2px;background:var(--acc)}
.srch{width:100%;padding:13px 16px;margin-bottom:12px;outline:0;border-radius:18px}
.srch::placeholder{color:var(--sub)}
.list{overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--bd);cursor:pointer}
.row:last-child{border:0}
.row:active{background:var(--glass2)}
.arn{font-family:'Amiri Quran',serif;font-size:24px;min-width:84px;direction:rtl;text-align:right}
.mid{flex:1;min-width:0}.mid b{display:block;font-size:15px}.mid small{color:var(--sub);font-size:13px}
.num{color:var(--sub);font-size:13px;min-width:30px;text-align:right}
.empty{text-align:center;color:var(--sub);padding:40px 16px;line-height:1.8}
.btn{background:var(--acc);color:#06210f;font-weight:700;padding:10px 18px;border-radius:14px;margin-top:6px}
.btn.ghost{background:var(--glass2);color:var(--txt)}
.card{padding:16px;margin-bottom:12px}
.card h3{margin:4px 0 10px;font-size:20px}.card h4{margin:0 0 10px;font-size:15px}.card small{color:var(--sub)}
.bar{height:8px;border-radius:8px;background:var(--glass2);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:8px}
.jump{display:flex;gap:8px}.jump select,.jump input{flex:1;min-width:0;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--glass2);outline:0}
.jump select option{color:#111}
.juzgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}

#nav{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:532px;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;border-radius:30px;z-index:10}
#nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;border-radius:24px;color:var(--sub);font-size:11.5px;font-weight:600}
#nav button.on{color:var(--acc);background:var(--glass2)}
.page{position:fixed;inset:0;z-index:20;background:var(--bgi),var(--bgc);background-attachment:fixed;transform:translateX(100%);transition:transform .26s ease;display:flex;flex-direction:column}

.hd{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;width:100%;max-width:560px;margin:0 auto}
.hd h2{margin:0;flex:1;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 6px rgba(0,0,0,.2)}
.hr{display:flex;gap:6px}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--glass2);border:1px solid var(--bd);font-weight:700}
.pb{flex:1;overflow-y:auto;width:100%;max-width:560px;margin:0 auto;padding:6px 14px calc(env(safe-area-inset-bottom,0px) + 110px)}
.load{text-align:center;padding:50px;color:var(--sub)}
.sb{display:flex;align-items:center;gap:10px;padding:12px 16px;margin:14px 0 8px}
.sb span{font-weight:700}.sb b{margin-left:auto;font-size:24px;font-family:'Amiri Quran',serif}.sb small{display:none}
.bis{text-align:center;font-size:calc(var(--szA) + 2px);padding:8px 0 14px;font-family:var(--fam)}
.ay{padding:14px 16px;margin-bottom:10px;transition:box-shadow .3s,border-color .3s}
.ay.playing,.v.playing{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc),0 8px 32px rgba(0,0,0,.2)}
.v.playing{border-radius:8px;box-shadow:none;background:rgba(74,222,128,.22)}
.ay-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.no{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--glass2);border:1px solid var(--bd);font-size:13px;font-weight:700}
.acts{margin-left:auto;display:flex;gap:2px}
.acts button{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--sub)}
.acts button.on{color:var(--acc)}
.acts svg{width:19px;height:19px}
.ay .ar{font-size:var(--szA);line-height:2.15;margin:4px 0 10px;text-align:right}
.lt{margin:6px 0;color:var(--acc);font-size:var(--szT);line-height:1.55;font-style:italic}
.id{margin:6px 0 0;font-size:var(--szT);line-height:1.6}
.tf{margin-top:10px;border-top:1px solid var(--bd);padding-top:8px;font-size:calc(var(--szT) - 1px);color:var(--sub)}
.tf summary{cursor:pointer;color:var(--acc);font-weight:600}
.mushaf{font-family:var(--fam);font-size:var(--szA);line-height:2.5;text-align:justify;text-align-last:center;direction:rtl;padding:6px 4px}
.v{cursor:pointer;border-radius:8px;padding:0 2px}
.vn{font-style:normal;display:inline-grid;place-items:center;min-width:1.5em;height:1.5em;border:1.5px solid var(--acc);border-radius:50%;font-size:.5em;margin:0 .25em;font-family:system-ui;color:var(--acc)}
.tj-h,.tj-s,.tj-l{color:#9aa3b2}.tj-n{color:#60a5fa}.tj-p{color:#38bdf8}.tj-m{color:#3b82f6}.tj-o{color:#2563eb}.tj-q{color:#f472b6}.tj-c{color:#fb923c}.tj-f{color:#f59e0b}.tj-w{color:#a3e635}.tj-i{color:#22d3ee}.tj-a{color:#4ade80}.tj-u{color:#84cc16}.tj-d{color:#c084fc}.tj-b{color:#e879f9}.tj-g{color:#34d399}
#mini{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 92px);width:calc(100% - 28px);max-width:532px;z-index:30;display:flex;align-items:center;gap:6px;padding:8px 8px 8px 16px;border-radius:26px}
body.has-page #mini{bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
#mini .mt{flex:1}#mini .mt b{display:block;font-size:14px}#mini small{color:var(--sub)}
#mini .ib{width:38px;height:38px}
#sheet{position:fixed;inset:0;z-index:50;pointer-events:none}
#sheet.on{pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .2s}
#sheet.on .scrim{opacity:1}
.sh{position:absolute;bottom:0;left:50%;width:100%;max-width:560px;max-height:86%;overflow:auto;border-radius:26px 26px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);transform:translate(-50%,105%);transition:transform .25s;background:var(--bgc);background-image:linear-gradient(var(--glass),var(--glass))}
#sheet.on .sh{transform:translate(-50%,0)}
.sh h3{margin:0 0 10px}
.si{display:flex;align-items:center;gap:14px;width:100%;padding:14px 8px;border-bottom:1px solid var(--bd);text-align:left}
.si:last-child{border:0}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 170px);transform:translateX(-50%);z-index:90;background:rgba(0,0,0,.78);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:86%;text-align:center}
#toast.on{opacity:1}
.set{padding:4px 16px;margin-bottom:6px;overflow:hidden}
.set.pad{padding:16px}
.srow{display:flex;align-items:center;gap:10px;padding:16px 0;border-bottom:1px solid var(--bd);cursor:pointer;font-weight:600}
.srow:last-child{border:0}
.srow span{flex:1}.srow em{font-style:normal;color:var(--sub);font-weight:500;font-size:14px;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow small{display:block;color:var(--sub);font-weight:400;margin-top:3px}
.srow svg{width:18px;height:18px;color:var(--sub)}
.tgl{display:flex;align-items:center;justify-content:space-between;padding:16px 0;cursor:pointer;font-weight:600}
.set>.tgl{border-bottom:0}
.sw{width:50px;height:28px;border-radius:20px;background:rgba(255,255,255,.22);position:relative;transition:.2s;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.sw.on{background:var(--acc)}.sw.on::after{left:25px}
.hint{margin:4px 10px 14px;font-size:13px;color:var(--sub);font-weight:600}
.hint.link{color:var(--acc);cursor:pointer}
.thm{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:6px 0 18px}
.th{position:relative;aspect-ratio:3/4;border-radius:16px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden;font-size:11px}
.th .ar{font-size:15px}
.th.on{border-color:var(--acc)}
.th-kaca{background:linear-gradient(180deg,#b6bac5,#5e6b80 55%,#172236);color:#fff}
.th-terang{background:#f1f3f6;color:#1b2430}.th-gelap{background:#232837;color:#fff}.th-cokelat{background:#3b2a22;color:#f6ece4}
.ck{position:absolute;bottom:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#06210f;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px}
.pv{background:var(--glass2);border-radius:14px;padding:10px 14px;margin:12px 0}
.pv .ar{margin:4px 0;line-height:2;text-align:right}
.steps{display:flex;gap:12px}
.step{flex:1;display:flex;align-items:center;border-radius:20px;overflow:hidden;background:var(--glass2)}
.step span{flex:1;text-align:center;font-size:13px;font-weight:600}
.step button{width:40px;height:38px;background:var(--acc);color:#06210f;font-size:20px;font-weight:700}
.fr{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--bd);cursor:pointer}
.fr .ar{font-size:24px;flex:1;text-align:right}
.fr b{min-width:130px}
.rad{width:22px;height:22px;border-radius:50%;border:2px solid var(--sub);display:grid;place-items:center;flex:none}
.rad.on{border-color:var(--acc)}.rad.on::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--acc)}
.lg{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd)}
.lg .ar{font-size:26px;min-width:56px;text-align:center}
.lg small{display:block;color:var(--sub)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:16px}.stat b{display:block;font-size:26px}.stat small{color:var(--sub)}
.week{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:8px}
.week div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;font-size:11px;color:var(--sub)}
.week i{width:100%;background:var(--acc);border-radius:8px 8px 3px 3px;min-height:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{padding:9px 14px;border-radius:16px;background:var(--glass2);border:1px solid var(--bd);font-weight:600;font-size:14px}
.chip.on{background:var(--acc);color:#06210f;border-color:transparent}
.rowh{display:flex;align-items:center;justify-content:space-between}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fold{position:relative;padding:18px 14px 14px;min-height:140px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;cursor:pointer;text-align:left}
.fold b{font-size:16px;word-break:break-word}.fold small{color:var(--sub)}
.fic{position:absolute;top:14px;left:14px;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--fc);color:#06210f}
.fic svg{width:26px;height:26px}
.dots{position:absolute;top:10px;right:8px;width:34px;height:34px;font-size:20px;border-radius:50%;color:var(--sub)}
.fold.add{align-items:center;justify-content:center;font-size:34px;color:var(--acc);border-style:dashed}
.fold.add small{font-size:14px}
.item{padding:14px 16px;margin-bottom:10px;cursor:pointer}
.item h4{margin:0 0 8px}
.item .ar{max-height:5.4em;overflow:hidden;text-align:right}
.field{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--glass2);outline:0;margin-bottom:10px}
.field::placeholder{color:var(--sub)}
.lbl{font-size:13px;color:var(--sub);margin:10px 4px 6px;font-weight:600;display:block}
.fchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.fchips .chip{flex:none;font-size:20px;line-height:1.6;padding:6px 14px;font-family:inherit}
input[type=range]{width:100%;accent-color:var(--acc)}
.sws{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sws button{width:32px;height:32px;border-radius:50%;border:2px solid var(--bd)}
.sws button.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.pvx{padding:14px 16px;margin:12px 0}
.pvx .ar{white-space:pre-wrap;text-align:inherit;direction:rtl}
.view .ar{white-space:pre-wrap;direction:rtl}
.note{margin-top:12px;color:var(--sub);line-height:1.7;white-space:pre-wrap}
.pol p{line-height:1.7;margin:0 0 12px;color:var(--sub)}.pol h4{margin:14px 0 6px}
/* splash */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bgi),var(--bgc);transition:opacity .7s,visibility .7s,transform .7s;overflow:hidden}
#splash.out{opacity:0;visibility:hidden;transform:scale(1.07)}
.orb{position:absolute;border-radius:50%;filter:blur(40px);opacity:.55;animation:fl 6s ease-in-out infinite alternate}
.o1{width:260px;height:260px;background:#fff;top:-60px;left:-70px}
.o2{width:300px;height:300px;background:#22c55e;bottom:-90px;right:-90px;animation-delay:-3s}
@keyframes fl{to{transform:translate(30px,40px) scale(1.15)}}
.lw{position:relative;width:150px;height:150px;display:grid;place-items:center}
.rg{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.55);animation:rg 2.4s ease-out infinite}
.rg.b{animation-delay:1.2s}
@keyframes rg{from{transform:scale(.8);opacity:.9}to{transform:scale(1.9);opacity:0}}
.logo{width:128px;height:128px;border-radius:34px;overflow:hidden;animation:pop 1.1s cubic-bezier(.2,1.3,.4,1) both,gl 2.4s ease-in-out .9s infinite alternate;position:relative}
.logo img{width:100%;height:100%;display:block}
.logo::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);animation:sh 1.6s 1.1s ease-out forwards}
@keyframes sh{to{transform:translateX(120%)}}
@keyframes pop{from{transform:scale(.2) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
@keyframes gl{from{box-shadow:0 0 0 0 rgba(94,234,212,0),0 10px 40px rgba(0,0,0,.3)}to{box-shadow:0 0 0 14px rgba(94,234,212,.14),0 10px 50px rgba(94,234,212,.4)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
#splash .bis{opacity:0;animation:rise 1s .9s both;font-size:30px;color:#fff;padding:0}
#splash h1{margin:0;font-size:25px;letter-spacing:.05em;color:#fff;opacity:0;animation:rise 1s 1.3s both;text-shadow:0 2px 12px rgba(0,0,0,.3)}
#splash p{margin:0;color:rgba(255,255,255,.8);opacity:0;animation:rise 1s 1.6s both;font-size:14px;letter-spacing:.12em}
.ld{width:140px;height:4px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:10px;opacity:0;animation:rise .5s 1.7s both}
.ld i{display:block;height:100%;width:0;background:#5eead4;animation:ld 1.2s 1.8s ease-out forwards}
@keyframes ld{to{width:100%}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}}
</style>
</head>
<body data-theme="kaca">

  <main id="main"></main>

</div>

  <div class="bis ar">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
  <h1>Al-Quran 30 Juz</h1>
  <p>BACA • DENGAR • RENUNGKAN</p>
  <div class="ld"><i></i></div>
</div>

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const uid=()=>Math.random().toString(36).slice(2,9);
const API='https://equran.id/api/v2', TJU='https://api.alquran.cloud/v1/surah/';
const VERSION='1.0.0', EMAIL='rifqihisyammuddin429@gmail.com';

/* ---------- icons ---------- */
const sv=p=>`<svg viewBox="0 0 24 24">${p}</svg>`;
const I={
 back:sv('<path d="M15 5l-7 7 7 7"/>'),chev:sv('<path d="M9 5l7 7-7 7"/>'),

 return segs;

const plain=t=>t.replace(/\[[a-z](?::\d+)?\[|\]/g,'');
const tjHtml=t=>t.replace(/\[([a-z])(?::\d+)?\[([^\]]*)\]/g,(m,c,x)=>`<span class="tj-${c}">${x}</span>`);
function strip4(t){const re=/\[[a-z](?::\d+)?\[[^\]]*\]|[\s\S]/g;let m,sp=0;while((m=re.exec(t))){if(m[0]===' '&&++sp===4)return t.slice(re.lastIndex)}return t}

/* ---------- reader ---------- */
async function openReader(spec){
 const D={};
 const el=openPage(spec.title,'<div class="load">Memuat…</div>',{right:`<button class="ib" id="rp">${I.play}</button><button class="ib" id="rq">${I.aa}</button>`});
 el.classList.add('reader');
 const pb=$('.pb',el);
 const need=[...new Set(spec.segs.map(g=>g.s))];
 let firstDraw=true;
 async function load(){
  pb.innerHTML=`<div class="load">Memuat…</div>`;
  try{
   await Promise.all(need.map(async n=>{
    D[n]=D[n]||{};
    D[n].d=D[n].d||await getSurah(n);
    if(S.tajwid&&!D[n].t)D[n].t=await getTj(n).catch(()=>null);
    if(S.tafsir&&!D[n].f)D[n].f=await getTf(n).catch(()=>null);
   }));
   draw();
  }catch(e){
   pb.innerHTML=`<div class="empty">Gagal memuat. Periksa koneksi internet.<br><button class="btn" id="rr">Coba lagi</button></div>`;
   $('#rr',pb).onclick=load;
  }
 }
 function arOf(n,a){
  const x=D[n],i=a-1;
  if(S.tajwid&&x.t&&x.t[i]){let t=x.t[i];if(a===1&&n!==1&&plain(t).replace(/[ً-ٰٟ]/g,'').startsWith('بسم'))t=strip4(t);return tjHtml(t)}
  return esc(x.d.ayat[i].teksArab);
 }
 function tfOf(n,a){const f=D[n].f;if(!f)return '';const o=f.find(z=>z.ayat===a);return o?o.teks:''}
 function draw(){
  let h='';
  const multi=spec.segs.length>1;
  for(const g of spec.segs){
   const x=D[g.s].d;
   h+=`<div class="sb glass"><span>${esc(x.namaLatin)}</span><b>${esc(x.nama)}</b></div>`;
   if(g.a1===1&&g.s!==1&&g.s!==9&&S.arab)h+=`<div class="bis">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>`;
   if(S.book&&S.arab){
    h+=`<div class="mushaf glass" style="padding:14px 12px">`;
    for(let a=g.a1;a<=g.a2;a++)h+=`<span class="v" data-s="${g.s}" data-a="${a}">${arOf(g.s,a)}<i class="vn">${AR(a)}</i></span> `;
    h+=`</div>`;
   }else{
    for(let a=g.a1;a<=g.a2;a++){
     const ay=x.ayat[a-1],tf=S.tafsir?tfOf(g.s,a):'';
     const bk=S.bm.some(b=>b.s===g.s&&b.a===a);
     h+=`<article class="ay glass" data-s="${g.s}" data-a="${a}"><div class="ay-top"><span class="no">${a}</span><div class="acts"><button data-act="play">${I.play}</button><button data-act="bm" class="${bk?'on':''}">${bk?sv('<path d="M6 4h12v17l-6-4-6 4z" fill="currentColor"/>'):I.bm}</button><button data-act="share">${I.share}</button><button data-act="more">⋯</button></div></div>`
      +(S.arab?`<p class="ar">${arOf(g.s,a)}</p>`:'')
      +(S.translit?`<p class="lt">${esc(ay.teksLatin)}</p>`:'')
      +(S.terj?`<p class="id">${esc(ay.teksIndonesia)}</p>`:'')
      +(tf?`<details class="tf"><summary>Tafsir</summary><p>${esc(tf)}</p></details>`:'')
      +`</article>`;
    }
   }
  }
  const st=pb.scrollTop;
  pb.innerHTML=h;
  $$('[data-s][data-a]',pb).forEach(n=>io.observe(n));
  if(firstDraw&&spec.jump){const t=$(`[data-s][data-a="${spec.jump}"]`,pb);if(t)setTimeout(()=>t.scrollIntoView({block:'start'}),50)}
  else pb.scrollTop=st;
  firstDraw=false;
  if(Q[qi])markPlaying(Q[qi],false);
 }
 const info=(s,a)=>{const x=D[s].d,ay=x.ayat[a-1];return {s,a,name:x.namaLatin,ar:ay.teksArab,lt:ay.teksLatin,id:ay.teksIndonesia,url:ay.audio[S.qari],tf:tfOf(s,a)}};
 const allItems=()=>{const l=[];for(const g of spec.segs)for(let a=g.a1;a<=g.a2;a++)l.push({s:g.s,a,url:D[g.s].d.ayat[a-1].audio[S.qari]});return l};
 const textOf=i=>`${i.ar}\n\n${i.lt}\n\n${i.id}\n\n(QS. ${i.name}: ${i.a})`;
 async function copy(t){try{await navigator.clipboard.writeText(t);toast('Disalin')}catch(e){toast('Tidak bisa menyalin')}}
 async function share(t){if(navigator.share){try{await navigator.share({text:t})}catch(e){}}else copy(t)}
 function toggleBm(s,a){const i=S.bm.findIndex(b=>b.s===s&&b.a===a);if(i>=0){S.bm.splice(i,1);toast('Bookmark dihapus')}else{S.bm.push({s,a,t:Date.now()});toast('Bookmark ditambahkan')}save();draw()}
 function act(k,s,a){
  const i=info(s,a);
  if(k==='play'){const all=allItems();playQueue(all,all.findIndex(z=>z.s===s&&z.a===a))}
  else if(k==='bm')toggleBm(s,a);
  else if(k==='share')share(textOf(i));
  else if(k==='more')ayahMenu(s,a);
 }
 function ayahMenu(s,a){
  const i=info(s,a),bk=S.bm.some(b=>b.s===s&&b.a===a);
  menu(`${i.name} : ${a}`,[
   [I.play,'Putar dari ayat ini',()=>{const all=allItems();playQueue(all,all.findIndex(z=>z.s===s&&z.a===a))}],
   [I.bm,bk?'Hapus bookmark':'Tambah bookmark',()=>toggleBm(s,a)],
   [I.tafsir,'Lihat tafsir',async()=>{let t=tfOf(s,a);if(!t){try{D[s].f=await getTf(s);t=tfOf(s,a)}catch(e){}}sheet(`<h3>Tafsir ${esc(i.name)}: ${a}</h3><p style="line-height:1.7">${esc(t||'Tafsir belum tersedia (butuh internet).')}</p>`)}],
   [I.copy,'Salin ayat',()=>copy(textOf(i))],
   [I.share,'Bagikan',()=>share(textOf(i))],
   [I.read,'Tandai terakhir dibaca',()=>{S.last={s,a};save();toast('Ditandai')}]
  ]);
 }
 pb.onclick=e=>{
  const card=e.target.closest('[data-s][data-a]');if(!card)return;
  const s=+card.dataset.s,a=+card.dataset.a,b=e.target.closest('[data-act]');
  if(b)act(b.dataset.act,s,a);
  else if(e.target.closest('.v')||e.target.closest('.ar'))ayahMenu(s,a);
 };
 $('#rp',el).onclick=()=>{if(!D[need[0]]||!D[need[0]].d)return;const all=allItems();if(Q.length&&!AU.paused){stopAudio()}else playQueue(all,0)};
 $('#rq',el).onclick=()=>quickSet(load);
 load();
}
function quickSet(after){

 sheet(`<h3>Tampilan bacaan</h3>${T.map(([k,l])=>`<div class="tgl" data-k="${k}"><span>${l}</span><i class="sw ${S[k]?'on':''}"></i></div>`).join('')}<div class="steps" style="margin-top:12px"><div class="step"><button data-sz="szT:-1">−</button><span>Teks</span><button data-sz="szT:1">+</button></div><div class="step"><button data-sz="szA:-2">−</button><span>Arab</span><button data-sz="szA:2">+</button></div></div>`,sh=>{

 });

function buildNav(){$('#nav').innerHTML=NAV.map(([k,t,ic])=>`<button class="${k===tab?'on':''}" data-t="${k}">${ic}<span>${t}</span></button>`).join('')}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.t;render();$('#main').scrollTop=0}};
function render(){buildNav();({quran:vQuran,read:vRead,tw:vTw,set:vSet})[tab]()}

function vQuran(){
 $('#main').innerHTML=`<div class="tabs glass">${['bookmark','juz','surah'].map(k=>`<button data-q="${k}" class="${qt===k?'on':''}">${k.toUpperCase()}</button>`).join('')}</div><div id="ql"></div>`;
 $('.tabs').onclick=e=>{const b=e.target.closest('button');if(b){qt=b.dataset.q;vQuran()}};
 const box=$('#ql');
 if(!L.length){box.innerHTML=`<div class="empty glass">Tidak bisa memuat daftar surah.<br>Periksa internet lalu coba lagi.<br><button class="btn" id="retry">Coba lagi</button></div>`;$('#retry').onclick=async()=>{try{L=await getList();vQuran()}catch(e){toast('Masih gagal memuat')}};return}
 if(qt==='surah'){
  box.innerHTML=`<input id="q" class="srch glass" placeholder="Cari surah…"><div id="sl" class="list glass"></div>`;
  const draw=f=>{const k=f.toLowerCase();$('#sl').innerHTML=L.filter(s=>!k||s.namaLatin.toLowerCase().includes(k)||s.arti.toLowerCase().includes(k)||String(s.nomor)===k).map(s=>`<div class="row" data-n="${s.nomor}"><div class="arn">${esc(s.nama)}</div><div class="mid"><b>${esc(s.namaLatin)}</b><small>${esc(s.arti)} (${s.jumlahAyat} Ayat)</small></div><span class="num">.${s.nomor}</span></div>`).join('')||'<div class="empty">Tidak ditemukan</div>'};
  draw('');$('#q').oninput=e=>draw(e.target.value.trim());
  $('#sl').onclick=e=>{const r=e.target.closest('[data-n]');if(r)openSurah(+r.dataset.n)};
 }else if(qt==='juz'){
  box.innerHTML=`<div class="list glass">${JUZ.map((_,i)=>{const g=juzSegs(i+1),f=g[0],l=g[g.length-1];return `<div class="row" data-j="${i+1}"><div class="arn">جزء ${AR(i+1)}</div><div class="mid"><b>Juz ${i+1}</b><small>${esc(L[f.s-1].namaLatin)} ${f.a1} – ${esc(L[l.s-1].namaLatin)} ${l.a2}</small></div><span class="num">.${i+1}</span></div>`}).join('')}</div>`;
  box.onclick=e=>{const r=e.target.closest('[data-j]');if(r){const j=+r.dataset.j;openReader({title:'Juz '+j,segs:juzSegs(j)})}};
 }else{
  const bm=[...S.bm].sort((a,b)=>b.t-a.t);
  box.innerHTML=bm.length?`<div class="list glass">${bm.map(b=>`<div class="row" data-s="${b.s}" data-a="${b.a}"><div class="arn">${esc((L[b.s-1]||{}).nama||'')}</div><div class="mid"><b>${esc((L[b.s-1]||{}).namaLatin||'')}</b><small>Ayat ${b.a}</small></div><button class="ib" data-del="1" style="width:36px;height:36px">${I.x}</button></div>`).join('')}</div>`:`<div class="empty glass">Belum ada bookmark.<br>Ketuk ikon bookmark pada ayat untuk menyimpannya.</div>`;
  box.onclick=e=>{const r=e.target.closest('.row');if(!r)return;const s=+r.dataset.s,a=+r.dataset.a;if(e.target.closest('[data-del]')){S.bm=S.bm.filter(b=>!(b.s===s&&b.a===a));save();vQuran()}else openSurah(s,a)};
 }
}

const readCount=()=>Object.keys(S.read).length;
function vRead(){
 const lr=S.last,n=readCount(),pct=Math.min(100,n/6236*100);
 $('#main').innerHTML=`<h1 class="ttl">Membaca</h1>
 <div class="card glass"><small>${lr?'Terakhir dibaca':'Belum ada bacaan'}</small><h3>${lr&&L[lr.s-1]?esc(L[lr.s-1].namaLatin)+' : '+lr.a:'Mulai dari Al-Fatihah'}</h3><button class="btn" id="cont">${lr?'Lanjutkan membaca':'Mulai membaca'}</button></div>
 <div class="card glass"><h4>Progres khatam</h4><div class="bar"><i style="width:${pct}%"></i></div><small>${n} dari 6.236 ayat (${pct.toFixed(1)}%)</small></div>
 <div class="card glass"><h4>Loncat ke ayat</h4><div class="jump"><select id="js">${L.map(s=>`<option value="${s.nomor}">${s.nomor}. ${esc(s.namaLatin)}</option>`).join('')}</select><input id="ja" type="number" min="1" placeholder="Ayat"><button class="btn" id="jg" style="margin:0">Buka</button></div></div>
 <div class="card glass"><h4>Baca per juz</h4><div class="juzgrid">${JUZ.map((_,i)=>`<button data-j="${i+1}">${i+1}</button>`).join('')}</div></div>`;
 if(!L.length){$('#main').innerHTML+=`<div class="empty glass">Daftar surah belum termuat. Buka menu Al-Quran dengan internet aktif.</div>`;return}
 $('#cont').onclick=()=>lr?openSurah(lr.s,lr.a):openSurah(1);
 $('#jg').onclick=()=>{const s=+$('#js').value,a=Math.max(1,Math.min(+$('#ja').value||1,L[s-1].jumlahAyat));openSurah(s,a)};
 $('.juzgrid').onclick=e=>{const b=e.target.closest('[data-j]');if(b){const j=+b.dataset.j;openReader({title:'Juz '+j,segs:juzSegs(j)})}};
}

/* ---------- Tawasul ---------- */
const DST={font:'amiri-quran',size:30,lh:2,color:'',align:'center',bold:false};
const stl=st=>`font-family:${famCss(famOf(st.font))};font-size:${st.size}px;line-height:${st.lh};${st.color?`color:${st.color};`:''}text-align:${st.align};font-weight:${st.bold?700:400}`;
const folderBy=id=>S.tw.folders.find(f=>f.id===id);
function vTw(){
 const F=S.tw.folders;
 $('#main').innerHTML=`<div class="rowh"><h1 class="ttl">Tawasul</h1><button class="ib glass" id="twm">⋯</button></div><p class="sub">Buku doa &amp; tawasul pribadi. Isi sendiri secara manual, atur font Arab sesuka Anda.</p>
 <div class="fgrid">${F.map(f=>`<div class="fold glass" data-f="${f.id}" style="--fc:${f.color}"><div class="fic">${I.folder}</div><button class="dots" data-m="${f.id}">⋯</button><b>${esc(f.name)}</b><small>${f.items.length} isi</small></div>`).join('')}<button class="fold glass add" id="fadd">＋<small>Buku baru</small></button></div>`;
 $('#fadd').onclick=newFolder;
 $('#twm').onclick=()=>menu('Tawasul',[[I.share,'Cadangkan (unduh JSON)',backup],[I.plus,'Pulihkan dari file',restore]]);
 $('.fgrid').onclick=e=>{
  const m=e.target.closest('[data-m]');
  if(m){e.stopPropagation();const f=folderBy(m.dataset.m);menu(f.name,[[I.edit,'Ubah nama',()=>askText('Ubah nama buku',f.name,v=>{f.name=v;save();vTw()})],[I.folder,'Ganti warna',()=>sheet(`<h3>Warna buku</h3><div class="sws">${FCOL.map(c=>`<button style="background:${c}" data-c="${c}"></button>`).join('')}</div>`,sh=>{sh.onclick=ev=>{const b=ev.target.closest('[data-c]');if(b){f.color=b.dataset.c;save();closeSheet();vTw()}}})],[I.trash,'Hapus buku',()=>{if(confirm('Hapus buku "'+f.name+'" beserta isinya?')){S.tw.folders=S.tw.folders.filter(x=>x!==f);save();vTw()}}]]);return}
  const c=e.target.closest('[data-f]');if(c)pFolder(c.dataset.f);
 };
}
function newFolder(){
 let col=FCOL[0];
 askText('Buku baru','',(v)=>{S.tw.folders.push({id:uid(),name:v,color:col,items:[]});save();vTw()},`<div class="sws" id="cs" style="margin-bottom:12px">${FCOL.map((c,i)=>`<button style="background:${c}" data-c="${c}" class="${i?'':'on'}"></button>`).join('')}</div>`);
 $('#cs').onclick=e=>{const b=e.target.closest('[data-c]');if(b){col=b.dataset.c;$$('#cs button').forEach(x=>x.classList.toggle('on',x===b))}};
}
function backup(){
 const blob=new Blob([JSON.stringify(S.tw)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tawasul-backup.json';a.click();toast('Cadangan diunduh');
}
function restore(){
 const i=document.createElement('input');i.type='file';i.accept='.json,application/json';
 i.onchange=async()=>{try{const d=JSON.parse(await i.files[0].text());if(!d.folders)throw 0;S.tw=d;save();vTw();toast('Data dipulihkan')}catch(e){toast('File tidak valid')}};i.click();
}
function pFolder(fid){
 const f=folderBy(fid);
 const el=openPage(f.name,(pb,el)=>{
  let q='';
  const draw=()=>{
   const k=q.toLowerCase(),items=f.items.filter(it=>!k||it.title.toLowerCase().includes(k)||it.ar.includes(q));
   pb.innerHTML=`<input class="field glass" id="fs" placeholder="Cari di buku ini…" value="${esc(q)}">`+(items.length?items.map(it=>`<div class="item glass" data-i="${it.id}"><h4>${esc(it.title)}</h4><div class="ar" style="${stl(it.st)}">${esc(it.ar)}</div></div>`).join(''):`<div class="empty glass">${f.items.length?'Tidak ditemukan.':'Buku masih kosong.<br>Ketuk ＋ untuk menambah doa atau bacaan.'}</div>`);
   const s=$('#fs',pb);s.oninput=e=>{q=e.target.value;const p=e.target.selectionStart;draw();const n=$('#fs',pb);n.focus();n.setSelectionRange(p,p)};
  };
  el.render=()=>{if(!folderBy(fid)){history.back();return}draw()};
  pb.onclick=e=>{const c=e.target.closest('[data-i]');if(c)pItem(fid,c.dataset.i)};
  draw();loadAllFonts();
 },{right:`<button class="ib" id="fa">${I.plus}</button>`});
 $('#fa',el).onclick=()=>pEdit(fid,null);
}
function pItem(fid,iid){
 const f=folderBy(fid);
 const el=openPage('Tawasul',(pb,el)=>{
  el.render=()=>{const it=f.items.find(x=>x.id===iid);if(!it){history.back();return}
   pb.innerHTML=`<div class="glass card view"><h3 style="margin-top:0">${esc(it.title)}</h3><div class="ar" style="${stl(it.st)}">${esc(it.ar)}</div>${it.note?`<div class="note">${esc(it.note)}</div>`:''}</div>`};
  el.render();
 },{right:`<button class="ib" data-x="c">${I.copy}</button><button class="ib" data-x="e">${I.edit}</button><button class="ib" data-x="d">${I.trash}</button>`});
 $('.hr',el).onclick=async e=>{
  const b=e.target.closest('[data-x]');if(!b)return;const it=f.items.find(x=>x.id===iid);
  if(b.dataset.x==='e')pEdit(fid,iid);
  else if(b.dataset.x==='d'){if(confirm('Hapus "'+it.title+'"?')){f.items=f.items.filter(x=>x!==it);save();history.back()}}
  else{const t=it.title+'\n\n'+it.ar+(it.note?'\n\n'+it.note:'');if(navigator.share){try{await navigator.share({text:t})}catch(_){}}else{try{await navigator.clipboard.writeText(t);toast('Disalin')}catch(_){}}}
 };
}
function pEdit(fid,iid){
 const f=folderBy(fid);const old=iid&&f.items.find(x=>x.id===iid);
 const w=old?JSON.parse(JSON.stringify(old)):{id:uid(),title:'',ar:'',note:'',st:Object.assign({},DST),t:Date.now()};
 const el=openPage(old?'Ubah isi':'Tambah isi',(pb)=>{
  loadAllFonts();
  const sw=['','#fde68a','#86efac','#93c5fd','#f9a8d4','#fca5a5','#111827','#ffffff'];
  pb.innerHTML=`<input class="field" id="t" placeholder="Judul (mis. Tawasul Syekh …)" value="${esc(w.title)}">
  <textarea class="field ar" id="a" rows="6" placeholder="Tulis / tempel teks Arab di sini" style="font-size:22px;line-height:2;text-align:right">${esc(w.ar)}</textarea>
  <textarea class="field" id="n" rows="3" placeholder="Catatan / arti (opsional)">${esc(w.note)}</textarea>
  <span class="lbl">PRATINJAU</span><div class="glass pvx"><div class="ar" id="pv"></div></div>
  <span class="lbl">JENIS FONT ARAB (${FONTS.length})</span><div class="fchips" id="fc">${FONTS.map(fn=>`<button class="chip ar" data-f="${fn[0]}" style="font-family:${famCss(fn[2])}">${esc(fn[1])}</button>`).join('')}</div>
  <span class="lbl">UKURAN: <b id="sz1"></b></span><input type="range" id="sz" min="18" max="80" step="1">
  <span class="lbl">JARAK BARIS: <b id="lh1"></b></span><input type="range" id="lh" min="1.2" max="3.4" step="0.1">
  <span class="lbl">WARNA TEKS</span><div class="sws" id="cl">${sw.map(c=>`<button data-c="${c}" style="background:${c||'linear-gradient(135deg,#fff 50%,#111 50%)'}"></button>`).join('')}<input type="color" id="cc" style="width:40px;height:32px;border:0;background:none"></div>
  <span class="lbl">RATA TEKS &amp; GAYA</span><div class="chips" id="al"><button class="chip" data-al="right">Kanan</button><button class="chip" data-al="center">Tengah</button><button class="chip" data-al="justify">Rata</button><button class="chip" data-b="1">Tebal</button></div>
  <button class="btn" id="sv" style="width:100%;margin-top:14px;padding:14px">Simpan</button>`;
  const upd=()=>{
   $('#pv',pb).style.cssText=stl(w.st);$('#pv',pb).textContent=w.ar||'بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ';
   $$('#fc .chip',pb).forEach(c=>c.classList.toggle('on',c.dataset.f===w.st.font));
   $('#sz',pb).value=w.st.size;$('#sz1',pb).textContent=w.st.size+'px';$('#lh',pb).value=w.st.lh;$('#lh1',pb).textContent=w.st.lh;
   $$('#cl [data-c]',pb).forEach(c=>c.classList.toggle('on',c.dataset.c===w.st.color));
   $$('#al [data-al]',pb).forEach(c=>c.classList.toggle('on',c.dataset.al===w.st.align));
   $('#al [data-b]',pb).classList.toggle('on',w.st.bold);
   $('#a',pb).style.fontFamily=famCss(famOf(w.st.font));
  };
  $('#t',pb).oninput=e=>w.title=e.target.value;
  $('#a',pb).oninput=e=>{w.ar=e.target.value;upd()};
  $('#n',pb).oninput=e=>w.note=e.target.value;
  $('#sz',pb).oninput=e=>{w.st.size=+e.target.value;upd()};
  $('#lh',pb).oninput=e=>{w.st.lh=+(+e.target.value).toFixed(1);upd()};
  $('#cc',pb).oninput=e=>{w.st.color=e.target.value;upd()};
  pb.onclick=e=>{
   const a=e.target.closest('[data-f]'),c=e.target.closest('[data-c]'),al=e.target.closest('[data-al]'),b=e.target.closest('[data-b]');
   if(a)w.st.font=a.dataset.f;else if(c)w.st.color=c.dataset.c;else if(al)w.st.align=al.dataset.al;else if(b)w.st.bold=!w.st.bold;
   if(a||c||al||b)upd();
  };
  $('#sv',pb).onclick=()=>{
   if(!w.ar.trim()){toast('Teks Arab masih kosong');return}
   if(!w.title.trim())w.title=w.ar.trim().split('\n')[0].slice(0,30);
   if(old)Object.assign(old,w);else f.items.push(w);
   save();toast('Tersimpan');history.back();
  };
  upd();
 });
}

/* ---------- Pengaturan ---------- */
let deferred=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});
function vSet(){
 const sr=(go,label,val,sub)=>`<div class="srow" data-go="${go}"><span>${label}${sub?`<small>${sub}</small>`:''}</span>${val?`<em>${esc(val)}</em>`:''}${I.chev}</div>`;
 $('#main').innerHTML=`<h1 class="ttl" style="text-align:center">Pengaturan</h1>
 <div class="set glass">${sr('disp','Pengaturan Tampilan')}${sr('qari','Qari',QARI[S.qari])}${sr('down','Unduhan')}${sr('stat','Statistik')}${sr('khatam','Target Khatam')}</div>
 <div style="height:12px"></div>
 <div class="set glass"><div class="srow" data-go="ver" style="cursor:default"><span>Versi Aplikasi</span><em>${VERSION}</em></div>${sr('bug','Laporan Bug','',EMAIL)}${deferred?`<div class="srow" data-go="inst"><span>Pasang ke layar utama</span>${I.chev}</div>`:''}</div>
 <div style="height:12px"></div>
 <div class="set glass">${sr('priv','Kebijakan Privasi')}</div>`;
 $('#main').onclick=e=>{const r=e.target.closest('[data-go]');if(!r)return;({disp:pDisplay,qari:pQari,down:pDown,stat:pStat,khatam:pKhatam,priv:pPriv,bug:()=>{location.href=`mailto:${EMAIL}?subject=${encodeURIComponent('Laporan Bug Al-Quran 30 Juz v'+VERSION)}&body=${encodeURIComponent('Jelaskan masalah:\n\n\n---\nVersi: '+VERSION+'\nPerangkat: '+navigator.userAgent)}`},inst:async()=>{if(deferred){deferred.prompt();deferred=null;vSet()}},ver:()=>{}})[r.dataset.go]()};
}
const tgRow=(k,l)=>`<div class="set glass"><div class="tgl" data-k="${k}"><span>${l}</span><i class="sw ${S[k]?'on':''}"></i></div></div>`;
function pDisplay(){
 openPage('Pengaturan Tampilan',(pb,el)=>{
  const th=[['kaca','Kaca'],['terang','Terang'],['gelap','Gelap'],['cokelat','Cokelat']];
  const render=()=>{
   const fn=FONTS.find(f=>f[0]===S.font)[1].replace(/ \(.*\)/,'');
   pb.innerHTML=`<div class="thm">${th.map(([k,n])=>`<button class="th th-${k} ${S.theme===k?'on':''}" data-th="${k}"><span class="ar">بِسْمِ ٱللَّهِ</span><small>${n}</small>${S.theme===k?'<i class="ck">✓</i>':''}</button>`).join('')}</div>
   ${tgRow('arab','Teks Arab')}<p class="hint link" data-act="book">${S.book?'Beralih ke Mode Per Ayat dari sini':'Beralih ke Mode Buku dari sini'}</p>
   ${tgRow('translit','Transliterasi')}<p class="hint">Perlihatkan pengucapan Ayat</p>
   <div class="set glass"><div class="srow" data-go="font"><span>Gaya Penulisan</span><em>${esc(fn)}</em>${I.chev}</div>
   <div class="srow tgl" data-k="tajwid"><span>Pewarnaan Tajwid</span><i class="sw ${S.tajwid?'on':''}"></i></div>
   <div class="srow" data-go="tj"><span>Panduan Warna Tajwid</span>${I.chev}</div>
   <div class="srow" data-go="terj"><span>Terjemahan</span><em>${S.terj?'Aktif':'Mati'}</em>${I.chev}</div>
   <div class="srow" data-go="tafsir"><span>Tafsir</span><em>${S.tafsir?'Aktif':'Mati'}</em>${I.chev}</div></div>
   <div class="set glass pad" style="margin-top:12px"><b>Ukuran Huruf</b><div class="pv"><p class="ar" style="font-size:var(--szA)">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</p><p class="lt">Bi-smi l-lāhi r-raḥmāni r-raḥīm(i)</p></div>
   <div class="steps"><div class="step"><button data-sz="szT:-1">−</button><span>Teks</span><button data-sz="szT:1">+</button></div><div class="step"><button data-sz="szA:-2">−</button><span>Bahasa Arab</span><button data-sz="szA:2">+</button></div></div></div>`;
  };
  el.render=render;render();
  pb.onclick=e=>{
   const t=e.target.closest('[data-k],[data-th],[data-go],[data-sz],[data-act]');if(!t)return;const d=t.dataset;
   if(d.k){S[d.k]=!S[d.k];if(d.k==='tajwid'&&S.tajwid)S.arab=true}
   else if(d.th)S.theme=d.th;
   else if(d.sz){const [k,v]=d.sz.split(':');const r=k==='szA'?[20,64]:[11,26];S[k]=Math.min(r[1],Math.max(r[0],S[k]+ +v))}
   else if(d.act==='book')S.book=!S.book;
   else if(d.go){({font:pFont,tj:pTjGuide,terj:()=>pToggle('terj','Terjemahan','Tampilkan terjemahan bahasa Indonesia di bawah setiap ayat.'),tafsir:()=>pToggle('tafsir','Tafsir','Tampilkan tafsir ringkas bahasa Indonesia pada setiap ayat. Perlu internet saat pertama kali, setelah itu tersimpan offline.')})[d.go]();return}
   save();applyVars();render();
  };
 });
}
function pToggle(k,title,desc){
 openPage(title,(pb,el)=>{
  const render=()=>{pb.innerHTML=tgRow(k,'Tampilkan '+title)+`<p class="hint">${esc(desc)}</p>`};
  el.render=render;render();
  pb.onclick=e=>{if(e.target.closest('[data-k]')){S[k]=!S[k];save();render()}};
 });
}
function pFont(){
 loadAllFonts();
 openPage('Gaya Penulisan',(pb,el)=>{
  const render=()=>{pb.innerHTML=`<div class="set glass">${FONTS.map(f=>`<div class="fr" data-f="${f[0]}"><b>${esc(f[1])}</b><span class="ar" style="font-family:${famCss(f[2])}">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ</span><i class="rad ${S.font===f[0]?'on':''}"></i></div>`).join('')}</div>`};
  el.render=render;render();
  pb.onclick=e=>{const r=e.target.closest('[data-f]');if(r){S.font=r.dataset.f;save();applyVars();render()}};
 });
}
function pTjGuide(){
 openPage('Panduan Warna Tajwid',`<div class="set glass">${TJG.map(([c,n,d])=>`<div class="lg"><span class="ar tj-${c}">${TJEX[c]}</span><div><b>${n}</b><small>${d}</small></div></div>`).join('')}</div><p class="hint">Warna berasal dari data tajwid otomatis dan dapat berbeda tipis dengan mushaf cetak.</p>`);
}
function pQari(){
 openPage('Qari',(pb,el)=>{
  const render=()=>{pb.innerHTML=`<div class="set glass">${Object.entries(QARI).map(([k,n])=>`<div class="fr" data-q="${k}"><b style="flex:1">${esc(n)}</b><i class="rad ${S.qari===k?'on':''}"></i></div>`).join('')}</div>`};
  el.render=render;render();
  pb.onclick=e=>{const r=e.target.closest('[data-q]');if(r){S.qari=r.dataset.q;save();render()}};
 });
}
function pDown(){
 openPage('Unduhan',(pb,el)=>{
  let busy=false,prog='';
  const render=async()=>{
   const have=await Promise.all(L.map(s=>idbGet('s'+s.nomor).then(Boolean)));
   const n=have.filter(Boolean).length;
   pb.innerHTML=`<div class="card glass"><h4>Bacaan offline</h4><div class="bar"><i style="width:${n/114*100}%"></i></div><small>${n} dari 114 surah tersimpan ${prog}</small><div style="display:flex;gap:8px;margin-top:10px"><button class="btn" id="da" ${busy?'disabled':''}>Unduh semua</button><button class="btn ghost" id="dx">Hapus semua</button></div><small style="display:block;margin-top:8px">Termasuk teks, terjemahan, transliterasi, tajwid, dan tafsir. Audio tetap perlu internet.</small></div>
   <div class="list glass">${L.map((s,i)=>`<div class="row" data-n="${s.nomor}"><div class="arn">${esc(s.nama)}</div><div class="mid"><b>${esc(s.namaLatin)}</b><small>${s.jumlahAyat} Ayat</small></div><span class="num">${have[i]?'✓':'⬇'}</span></div>`).join('')}</div>`;
  };
  el.render=render;render();
  const dl=n=>Promise.all([getSurah(n),getTj(n),getTf(n)]);
  pb.onclick=async e=>{
   if(e.target.closest('#da')){
    if(busy)return;busy=true;let done=0;const q=L.map(s=>s.nomor);
    const worker=async()=>{while(q.length){const n=q.shift();try{await dl(n)}catch(_){}prog=`(${++done}/114)`;if(done%6===0)render()}};
    await Promise.all([worker(),worker(),worker()]);busy=false;prog='';render();toast('Unduhan selesai');
   }else if(e.target.closest('#dx')){
    if(confirm('Hapus semua data offline?')){await idbClear();await idbSet('list',{data:L});render()}
   }else{const r=e.target.closest('[data-n]');if(r){toast('Mengunduh…');try{await dl(+r.dataset.n);toast('Tersimpan');render()}catch(_){toast('Gagal, cek internet')}}}
  };
 });
}
function pStat(){
 openPage('Statistik',(pb,el)=>{
  el.render=()=>{
   const n=readCount(),cnt={};Object.keys(S.read).forEach(k=>{const s=k.split(':')[0];cnt[s]=(cnt[s]||0)+1});
   const done=L.filter(s=>(cnt[s.nomor]||0)>=s.jumlahAyat).length;
   const days=[];for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*864e5);days.push([['Min','Sen','Sel','Rab','Kam','Jum','Sab'][d.getDay()],S.daily[fmt(d)]||0])}
   const mx=Math.max(1,...days.map(d=>d[1]));
   pb.innerHTML=`<div class="stats"><div class="stat glass"><b>${n}</b><small>Ayat dibaca</small></div><div class="stat glass"><b>${(n/6236*100).toFixed(1)}%</b><small>Progres khatam</small></div><div class="stat glass"><b>${done}</b><small>Surah tamat</small></div><div class="stat glass"><b>${S.streak.n}</b><small>Hari beruntun</small></div><div class="stat glass"><b>${Math.floor(S.secs/60)}</b><small>Menit membaca</small></div><div class="stat glass"><b>${S.bm.length}</b><small>Bookmark</small></div></div>
   <div class="card glass" style="margin-top:12px"><h4>7 hari terakhir (ayat)</h4><div class="week">${days.map(d=>`<div><span>${d[1]}</span><i style="height:${d[1]/mx*70}%"></i><span>${d[0]}</span></div>`).join('')}</div></div>`;
  };
  el.render();
 });
}
function pKhatam(){
 openPage('Target Khatam',(pb,el)=>{
  const render=()=>{
   const k=S.khatam,n=readCount(),per=Math.ceil(6236/k.days),td=S.daily[today()]||0;
   const start=k.start?new Date(k.start+'T00:00:00'):null,end=start?new Date(start.getTime()+k.days*864e5):null;
   const left=end?Math.max(0,Math.ceil((end-Date.now())/864e5)):k.days;
   pb.innerHTML=`<div class="card glass"><h4>Target selesai dalam</h4><div class="chips">${[7,14,30,60,90,180].map(d=>`<button class="chip ${k.days===d?'on':''}" data-d="${d}">${d} hari</button>`).join('')}</div></div>
   <div class="card glass"><h4>Progres</h4><div class="bar"><i style="width:${Math.min(100,n/6236*100)}%"></i></div><small>${n} / 6.236 ayat</small>
   <div class="stats" style="margin-top:12px"><div><b style="font-size:22px">${per}</b><br><small>ayat per hari</small></div><div><b style="font-size:22px">${td}</b><br><small>dibaca hari ini</small></div><div><b style="font-size:22px">${left}</b><br><small>hari tersisa</small></div><div><b style="font-size:22px">${end?end.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'-'}</b><br><small>tanggal target</small></div></div>
   <button class="btn ghost" id="kr" style="margin-top:14px">Mulai ulang target</button></div>`;
  };
  el.render=render;render();
  pb.onclick=e=>{
   const d=e.target.closest('[data-d]');
   if(d){S.khatam.days=+d.dataset.d;if(!S.khatam.start)S.khatam.start=today();save();render()}
   else if(e.target.closest('#kr')){S.khatam.start=today();S.read={};S.daily={};save();render();toast('Target dimulai ulang')}
  };
 });
}
function pPriv(){
 openPage('Kebijakan Privasi',`<div class="card glass pol"><h4>Data Anda</h4><p>Aplikasi ini tidak meminta akun dan tidak mengumpulkan data pribadi. Bookmark, progres baca, pengaturan, dan isi Tawasul disimpan hanya di perangkat Anda.</p><h4>Koneksi internet</h4><p>Teks Al-Quran, terjemahan, tafsir, tajwid, dan audio diambil dari layanan publik (equran.id dan alquran.cloud) serta font dari Google Fonts. Data yang sudah diunduh dapat dibaca offline.</p><h4>Laporan bug</h4><p>Menu Laporan Bug membuka aplikasi email Anda. Isi laporan hanya terkirim jika Anda menekan kirim.</p></div>`);
}

/* ---------- boot ---------- */
async function boot(){
 applyVars();
 if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
 history.replaceState({},'');
 try{L=await getList()}catch(e){L=[]}
 render();
}
boot();
setTimeout(()=>$('#splash').classList.add('out'),3200);
setTimeout(()=>$('#splash').remove(),4200);
</script>
